  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .mesh-gradient {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 60% at 15% 30%, rgba(37,211,102,0.10) 0%, transparent 65%),
        radial-gradient(ellipse 50% 50% at 85% 70%, rgba(37,211,102,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 40% 40% at 50% 10%, rgba(37,211,102,0.05) 0%, transparent 55%);
    }
    .grid-bg {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,0,0,0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.07) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 40%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 40%, transparent 100%);
    }
    .content { position: relative; z-index: 1; text-align: center; padding: 2rem; }
    .brand-logo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      display: block;
      margin: 0 auto 1.8rem;
      object-fit: cover;
      box-shadow: 0 18px 40px -16px rgba(0,0,0,0.35);
    }
    .message {
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 700;
      color: #0a0a0a;
      line-height: 1.3;
    }
    .message span { color: #25D366; }
    .dots { display: inline-flex; gap: 6px; margin-top: 1.5rem; }
    .dots span {
      width: 8px;
      height: 8px;
      background: #25D366;
      border-radius: 50%;
      animation: bounce 1.2s ease-in-out infinite;
    }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.7); opacity: 0.5; }
      40%            { transform: scale(1);   opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="bg">
    <div class="mesh-gradient"></div>
    <div class="grid-bg"></div>
  </div>

  <div class="content">
    <img class="brand-logo" src="logo%20metodoalcontrario%20rinnovato.png" alt="Metodo al Contrario">
    <p class="message">Ti stiamo reindirizzando su <span>WhatsApp</span></p>
    <div class="dots">
      <span></span><span></span><span></span>
    </div>
  </div>

  <script>

    }, 2000);
  </script>

</body>
