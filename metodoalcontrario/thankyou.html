<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metodo al Contrario</title>
  <meta name="robots" content="noindex">

  <!-- ====================================================================
       PIXEL TRACKING (Meta + TikTok) — DA INSERIRE IN SEGUITO
       Su questa pagina di norma va l'evento "Lead". Incollare qui i blocchi
       <script> dei pixel quando saranno pronti.
       ==================================================================== -->

  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .mesh-gradient {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 60% at 15% 30%, rgba(37,211,102,0.10) 0%, transparent 65%),
        radial-gradient(ellipse 50% 50% at 85% 70%, rgba(37,211,102,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 40% 40% at 50% 10%, rgba(37,211,102,0.05) 0%, transparent 55%);
    }
    .grid-bg {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,0,0,0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.07) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 40%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 40%, transparent 100%);
    }
    .content { position: relative; z-index: 1; text-align: center; padding: 2rem; }
    .brand {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      letter-spacing: 0.08em;
      color: #0a0a0a;
      margin-bottom: 1.5rem;
    }
    .message {
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 700;
      color: #0a0a0a;
      line-height: 1.3;
    }
    .message span { color: #25D366; }
    .dots { display: inline-flex; gap: 6px; margin-top: 1.5rem; }
    .dots span {
      width: 8px;
      height: 8px;
      background: #25D366;
      border-radius: 50%;
      animation: bounce 1.2s ease-in-out infinite;
    }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.7); opacity: 0.5; }
      40%            { transform: scale(1);   opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="bg">
    <div class="mesh-gradient"></div>
    <div class="grid-bg"></div>
  </div>

  <div class="content">
    <p class="brand">METODO AL CONTRARIO</p>
    <p class="message">Ti stiamo reindirizzando su <span>WhatsApp</span></p>
    <div class="dots">
      <span></span><span></span><span></span>
    </div>
  </div>

  <!-- NUMERO WHATSAPP PLACEHOLDER: sostituire le X con il numero reale (formato 39XXXXXXXXXX) -->
  <script>
    setTimeout(function() {
      window.location.href = "https://wa.me/39XXXXXXXXXX?text=Ciao%2C%20vorrei%20pi%C3%B9%20informazioni%20sul%20Metodo%20al%20Contrario%20per%20i%20lead%20nel%20settore%20energia%2C%20grazie";
    }, 2000);
  </script>

</body>
</html>
