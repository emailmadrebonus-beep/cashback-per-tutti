    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: #f5f7fb;

      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }
    .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .mesh-gradient {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 70% 60% at 15% 25%, rgba(37,99,235,0.12) 0%, transparent 65%),
        radial-gradient(ellipse 50% 50% at 85% 75%, rgba(37,211,102,0.09) 0%, transparent 60%),
        radial-gradient(ellipse 40% 40% at 50% 5%, rgba(59,130,246,0.06) 0%, transparent 55%);
    }
    .grid-bg {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(0,0,0,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.06) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 40%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 40%, transparent 100%);
    }
    .content { position: relative; z-index: 1; text-align: center; padding: 2rem; max-width: 560px; }
    .logo { width: 60px; height: 60px; border-radius: 50%; margin: 0 auto 1.5rem; display: block; }
    .message {
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 800; color: #0a0a0a; line-height: 1.3; letter-spacing: -0.02em;
    }
    .message span { color: #25D366; }
    .sub { margin-top: 0.9rem; font-size: 1rem; color: #64748b; line-height: 1.6; }
    .dots { display: inline-flex; gap: 6px; margin-top: 1.6rem; }
    .dots span {
      width: 9px; height: 9px; background: #25D366; border-radius: 50%;
      animation: bounce 1.2s ease-in-out infinite;
    }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.7); opacity: 0.5; }
      40%           { transform: scale(1);   opacity: 1; }
    }
    .fallback { margin-top: 1.6rem; font-size: 0.9rem; color: #94a3b8; }
    .fallback a { color: #2563eb; font-weight: 700; text-decoration: underline; }
    @media (prefers-reduced-motion: reduce) { .dots span { animation: none; } }
