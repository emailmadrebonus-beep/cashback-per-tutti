<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cashback per Tutti</title>
  <link rel="icon" type="image/png" href="logo-cashback.png">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* ── Sfondo mesh + griglia (identico alla hero) ── */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .mesh-gradient {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 60% at 15% 30%, rgba(37,211,102,0.13) 0%, transparent 65%),
        radial-gradient(ellipse 50% 50% at 85% 70%, rgba(37,211,102,0.09) 0%, transparent 60%),
        radial-gradient(ellipse 40% 40% at 50% 10%, rgba(37,211,102,0.07) 0%, transparent 55%);
    }

    .grid-bg {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(37,211,102,0.18) 1px, transparent 1px),
        linear-gradient(90deg, rgba(37,211,102,0.18) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 40%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 40%, transparent 100%);
    }

    /* ── Contenuto centrato ── */
    .content {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem;
    }

    .logo {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      margin: 0 auto 1.5rem;
      display: block;
    }

    .message {
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 700;
      color: #1a1a2e;
      line-height: 1.3;
    }

    .message span {
      color: #25D366;
    }

    .dots {
      display: inline-flex;
      gap: 6px;
      margin-top: 1.5rem;
    }

    .dots span {
      width: 8px;
      height: 8px;
      background: #25D366;
      border-radius: 50%;
      animation: bounce 1.2s ease-in-out infinite;
    }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.7); opacity: 0.5; }
      40%            { transform: scale(1);   opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="bg">
    <div class="mesh-gradient"></div>
    <div class="grid-bg"></div>
  </div>

  <div class="content">
    <img src="logo-cashback.png" alt="Cashback per Tutti" class="logo">
    <p class="message">Ti stiamo reindirizzando su <span>WhatsApp</span></p>
    <div class="dots">
      <span></span><span></span><span></span>
    </div>
  </div>

  <script>
    setTimeout(function() {
      window.location.href = "https://wa.me/393514285884?text=Ciao%2C%20vorrei%20ricevere%20l%27accesso%20all%27app%20e%20il%20video%20gratuito%20per%20iniziare%20a%20risparmiare%2C%20grazie%21";
    }, 2000);
  </script>

</body>
</html>
