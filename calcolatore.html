<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calcolatore Piano Compensi — 6 Livelli</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0a0a0a;
      color: #f5f5f5;
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .calc-wrapper {
      width: 100%;
      max-width: 640px;
    }

    .calculator {
      background: #1a1a1a;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.07);
      overflow: hidden;
    }

    /* ── HEADER ── */
    .calc-header {
      padding: 1.2rem 1.5rem 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .calc-title {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      color: #666;
      text-transform: uppercase;
    }

    /* ── SLIDERS ── */
    .sliders-section {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
    }

    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .slider-label-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .slider-label {
      font-size: 0.68rem;
      font-weight: 500;
      color: #888;
      letter-spacing: 0.03em;
    }

    .slider-val {
      font-family: 'Bebas Neue', cursive;
      font-size: 1.2rem;
      color: #22c55e;
      letter-spacing: 0.06em;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 5px;
      border-radius: 99px;
      background: linear-gradient(
        to right,
        #22c55e 0%,
        #22c55e var(--fill, 0%),
        #2d2d2d var(--fill, 0%),
        #2d2d2d 100%
      );
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: #22c55e;
      cursor: pointer;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.18), 0 0 10px rgba(34, 197, 94, 0.35);
      transition: box-shadow 0.15s;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      box-shadow: 0 0 0 5px rgba(34, 197, 94, 0.22), 0 0 16px rgba(34, 197, 94, 0.5);
    }

    input[type="range"]::-moz-range-thumb {
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: #22c55e;
      cursor: pointer;
      border: none;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.18), 0 0 10px rgba(34, 197, 94, 0.35);
    }

    /* ── LEVELS ── */
    .levels-section {
      padding: 4px 0;
    }

    .level-row {
      display: grid;
      grid-template-columns: 80px minmax(0, 1fr) 100px 82px;
      align-items: center;
      gap: 0.8rem;
      padding: 0.72rem 1.5rem;
      background: #222;
      margin: 3px 0;
      transition: background 0.15s;
    }

    .level-row:hover {
      background: #252525;
    }

    .level-name {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #f0f0f0;
    }

    .bar-track {
      height: 5px;
      background: #2a2a2a;
      border-radius: 99px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: #22c55e;
      border-radius: 99px;
      width: 0%;
      transition: width 0.45s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.35);
    }

    .level-people {
      font-size: 0.66rem;
      color: #666;
      text-align: right;
      white-space: nowrap;
    }

    .level-amount {
      font-family: 'Bebas Neue', cursive;
      font-size: 1.1rem;
      letter-spacing: 0.04em;
      color: #f0f0f0;
      text-align: right;
      white-space: nowrap;
    }

    /* ── TOTALS ── */
    .totals-section {
      padding: 0.75rem 1.5rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .total-main {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(34, 197, 94, 0.08);
      border: 1px solid rgba(34, 197, 94, 0.25);
      border-radius: 10px;
      padding: 0.95rem 1.25rem;
    }

    .total-main-label {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: #22c55e;
      text-transform: uppercase;
    }

    .total-main-value {
      font-family: 'Bebas Neue', cursive;
      font-size: 2.1rem;
      letter-spacing: 0.05em;
      color: #c8a84b;
    }

    .totals-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }

    .total-card {
      background: #222;
      border-radius: 8px;
      padding: 0.8rem 1rem;
    }

    .total-card-label {
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #555;
      text-transform: uppercase;
    }

    .total-card-sub {
      font-size: 0.6rem;
      color: #4a4a4a;
      margin-top: 2px;
      margin-bottom: 5px;
    }

    .total-card-value {
      font-family: 'Bebas Neue', cursive;
      font-size: 1.35rem;
      letter-spacing: 0.05em;
      color: #c8a84b;
    }

    /* ── MOBILE ── */
    @media (max-width: 500px) {
      .sliders-section {
        grid-template-columns: 1fr;
        gap: 1rem;
        padding: 1rem;
      }

      .level-row {
        grid-template-columns: 68px minmax(0, 1fr) 76px 64px;
        gap: 0.5rem;
        padding: 0.65rem 1rem;
      }

      .level-name { font-size: 0.55rem; }
      .level-people { font-size: 0.58rem; }
      .level-amount { font-size: 0.95rem; }

      .total-main {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.2rem;
      }

      .total-main-value { font-size: 1.7rem; }

      .calc-header,
      .totals-section { padding-left: 1rem; padding-right: 1rem; }
    }
  </style>
</head>
<body>

<div class="calc-wrapper">
  <div class="calculator">

    <div class="calc-header">
      <p class="calc-title">Piano Compensi — 6 Livelli</p>
    </div>

    <div class="sliders-section">
      <div class="slider-group">
        <div class="slider-label-row">
          <span class="slider-label">Persone che porti tu</span>
          <span class="slider-val" id="val1">10</span>
        </div>
        <input type="range" id="slider1" min="3" max="20" step="1" value="10">
      </div>
      <div class="slider-group">
        <div class="slider-label-row">
          <span class="slider-label">Portate da ognuno</span>
          <span class="slider-val" id="val2">5</span>
        </div>
        <input type="range" id="slider2" min="2" max="8" step="1" value="5">
      </div>
    </div>

    <div class="levels-section" id="levelsSection"></div>

    <div class="totals-section">
      <div class="total-main">
        <span class="total-main-label">Potenziale Totale Una Tantum</span>
        <span class="total-main-value" id="totalUna">€0</span>
      </div>
      <div class="totals-row">
        <div class="total-card">
          <p class="total-card-label">Ricorrenza Mensile</p>
          <p class="total-card-sub">Anno 1 · €1 / persona</p>
          <p class="total-card-value" id="totalA1">€0</p>
        </div>
        <div class="total-card">
          <p class="total-card-label">Ricorrenza Mensile</p>
          <p class="total-card-sub">Anno 2 · €1,50 / persona</p>
          <p class="total-card-value" id="totalA2">€0</p>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
  'use strict';

  const LEVELS_DEF = [
    { name: 'DIRETTI',   rate: 50   },
    { name: 'LIVELLO 2', rate: 15   },
    { name: 'LIVELLO 3', rate: 5    },
    { name: 'LIVELLO 4', rate: 3    },
    { name: 'LIVELLO 5', rate: 2.5  },
    { name: 'LIVELLO 6', rate: 2.5  },
  ];

  const CAP_DISPLAY = 50000;

  // Build level rows dynamically
  const section = document.getElementById('levelsSection');
  const barEls = [], peopleEls = [], amountEls = [];

  LEVELS_DEF.forEach(function(lvl, i) {
    const row = document.createElement('div');
    row.className = 'level-row';
    row.innerHTML =
      '<span class="level-name">' + lvl.name + '</span>' +
      '<div class="bar-track"><div class="bar-fill" id="bar' + i + '"></div></div>' +
      '<span class="level-people" id="ppl' + i + '"></span>' +
      '<span class="level-amount" id="amt' + i + '"></span>';
    section.appendChild(row);
    barEls.push(document.getElementById('bar' + i));
    peopleEls.push(document.getElementById('ppl' + i));
    amountEls.push(document.getElementById('amt' + i));
  });

  // ── Animated counter engine ──
  const anim = {};

  function animTo(key, el, target, fmt) {
    if (!anim[key]) anim[key] = { val: target, raf: null };
    const a = anim[key];
    if (a.raf) { cancelAnimationFrame(a.raf); a.raf = null; }
    const from = a.val;
    const t0 = performance.now();
    const dur = 380;

    (function step(now) {
      const p = Math.min((now - t0) / dur, 1);
      const ease = 1 - Math.pow(1 - p, 3);
      a.val = from + (target - from) * ease;
      el.textContent = fmt(a.val);
      if (p < 1) {
        a.raf = requestAnimationFrame(step);
      } else {
        a.val = target;
        a.raf = null;
      }
    })(t0);
  }

  // ── Formatters ──
  function fmtInt(n) {
    return Math.round(n).toLocaleString('it-IT');
  }

  function fmtEur(n) {
    const v = Math.round(n * 100) / 100;
    return '€' + v.toLocaleString('it-IT', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  }

  // ── Calculations ──
  function calcPeople(s1, s2) {
    return LEVELS_DEF.map(function(_, i) { return s1 * Math.pow(s2, i); });
  }

  // Log-scale bar width so lower levels are visually distinguishable
  function barWidth(count, maxCount) {
    if (count <= 0 || maxCount <= 0) return 0;
    return (Math.log(count + 1) / Math.log(maxCount + 1)) * 100;
  }

  function setSliderFill(slider, min, max) {
    const pct = ((+slider.value - min) / (max - min)) * 100;
    slider.style.setProperty('--fill', pct.toFixed(1) + '%');
  }

  // ── Main update ──
  function update() {
    const s1 = +slider1.value;
    const s2 = +slider2.value;

    valEl1.textContent = s1;
    valEl2.textContent = s2;
    setSliderFill(slider1, 3, 20);
    setSliderFill(slider2, 2, 8);

    const people = calcPeople(s1, s2);
    const maxPeople = people[5]; // livello 6 ha sempre il massimo
    let totalAmt = 0;
    let totalPpl = 0;

    LEVELS_DEF.forEach(function(lvl, i) {
      const cnt  = people[i];
      const amt  = cnt * lvl.rate;
      totalAmt  += amt;
      totalPpl  += cnt;

      // Barra proporzionale (scala logaritmica)
      barEls[i].style.width = barWidth(cnt, maxPeople) + '%';

      // Conteggio persone
      if (cnt > CAP_DISPLAY) {
        // Blocca animazione e mostra testo statico
        if (anim['p' + i] && anim['p' + i].raf) {
          cancelAnimationFrame(anim['p' + i].raf);
          anim['p' + i].raf = null;
        }
        peopleEls[i].textContent = '50.000+ persone';
      } else {
        animTo('p' + i, peopleEls[i], cnt, function(v) { return fmtInt(v) + ' persone'; });
      }

      // Importo livello
      animTo('a' + i, amountEls[i], amt, fmtEur);
    });

    // Totali
    animTo('una', document.getElementById('totalUna'), totalAmt,       fmtEur);
    animTo('a1',  document.getElementById('totalA1'),  totalPpl * 1,   fmtEur);
    animTo('a2',  document.getElementById('totalA2'),  totalPpl * 1.5, fmtEur);
  }

  const slider1 = document.getElementById('slider1');
  const slider2 = document.getElementById('slider2');
  const valEl1  = document.getElementById('val1');
  const valEl2  = document.getElementById('val2');

  slider1.addEventListener('input', update);
  slider2.addEventListener('input', update);

  // Render iniziale
  update();
</script>

</body>
</html>
